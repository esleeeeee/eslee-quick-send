name: Regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/QuickSend.Core.Tests
      - run: dotnet run --project tests/QuickSend.Network.Checks -- 67108864
      - run: dotnet run --project tests/QuickSend.Windows.Persistence.Tests
      - run: dotnet build src/QuickSend.Windows
      - name: Record validation evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/validation | Out-Null
          git rev-parse HEAD | Set-Content artifacts/validation/source-sha.txt
          Get-ChildItem src -Recurse -File -Filter *.dll | Where-Object FullName -Match '[\\/]bin[\\/]' | Get-FileHash -Algorithm SHA256 | Select-Object Path,Hash | ConvertTo-Json | Set-Content artifacts/validation/sha256.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-validation
          path: artifacts/validation
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: bash gradlew testDebugUnitTest assembleDebug --no-daemon
        working-directory: android
      - name: Record Android evidence
        if: always()
        run: |
          mkdir -p artifacts/validation
          git rev-parse HEAD > artifacts/validation/source-sha.txt
          find android/app/build/outputs/apk -name '*.apk' -exec sha256sum {} \; > artifacts/validation/apk-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-validation
          path: |
            artifacts/validation
            android/app/build/reports/tests
